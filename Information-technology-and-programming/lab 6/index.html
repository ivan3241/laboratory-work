<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Мета-тег для адаптивности -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Марк Лебедев — архитектор</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">

    <header class="page__header header">
        <a class="header__logo" href="#top">М. Лебедев</a>
        <nav class="header__nav">
            <a class="header__link" href="#projects">Проекты</a>
            <a class="header__link" href="#contacts">Контакты</a>
        </nav>
    </header>

    <main class="page__main" id="top">

        <section class="hero">
            <h1 class="hero__title">Пространство как тишина</h1>
            <p class="hero__text">Проектирую дома и общественные здания, где форма подчинена свету.</p>
        </section>

        <section class="projects" id="projects">
            <article class="project project--wide">
                <img class="project__img" src="img/project-1.svg" alt="Дом «Горизонт»">
                <div class="project__meta">
                    <span class="project__num">01</span>
                    <h2 class="project__name">Дом «Горизонт»</h2>
                    <span class="project__year">2024</span>
                </div>
            </article>

            <article class="project project--tall">
                <img class="project__img" src="img/project-2.svg" alt="Башня «Маяк»">
                <div class="project__meta">
                    <span class="project__num">02</span>
                    <h2 class="project__name">Башня «Маяк»</h2>
                    <span class="project__year">2023</span>
                </div>
            </article>

            <article class="project">
                <img class="project__img" src="img/project-3.svg" alt="Павильон «Арка»">
                <div class="project__meta">
                    <span class="project__num">03</span>
                    <h2 class="project__name">Павильон «Арка»</h2>
                    <span class="project__year">2022</span>
                </div>
            </article>

            <article class="project">
                <img class="project__img" src="img/project-4.svg" alt="Библиотека «Ступени»">
                <div class="project__meta">
                    <span class="project__num">04</span>
                    <h2 class="project__name">Библиотека «Ступени»</h2>
                    <span class="project__year">2021</span>
                </div>
            </article>
        </section>

        <section class="contacts" id="contacts">
            <h2 class="contacts__title">Контакты</h2>
            <a class="contacts__mail" href="mailto:hello@lebedev.example">hello@lebedev.example</a>
        </section>
    </main>

    <footer class="page__footer footer">
        <p class="footer__text">&copy; 2026 Марк Лебедев</p>
        <a class="footer__link" href="#top">Наверх ↑</a>
    </footer>

</body>
</html>
